included:
  - Sources
  - Tests
  - Example/MediaPickerExample

excluded:
  - .build
  - .swiftpm

opt_in_rules:
  - closure_spacing
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - modifier_order
  - sorted_imports
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call

force_cast: error
force_try: error
force_unwrapping: error

line_length:
  warning: 100
  error: 120
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 250
  error: 400

file_length:
  warning: 400
  error: 600

function_body_length:
  warning: 40
  error: 70

cyclomatic_complexity:
  warning: 10
  error: 15

custom_rules:
  struct_opening_blank_line:
    name: Struct Opening Blank Line
    regex: '(?m)^[ \t]*(?:(?:public|internal|package|private|fileprivate)[ \t]+)*struct[ \t]+[^\n{]+\{[ \t]*\n(?![ \t]*\n)'
    message: Add an empty line immediately after the opening brace of a struct.
    severity: warning
  struct_closing_blank_line:
    name: Struct Closing Blank Line
    regex: '(?ms)^([ \t]*)(?:(?:public|internal|package|private|fileprivate)[ \t]+)*struct[ \t]+[^\n{]+\{(?:(?!^\1\}).)*\n[ \t]*\S[^\n]*\n\1\}'
    message: Add an empty line immediately before the closing brace of a struct.
    severity: warning
  class_opening_blank_line:
    name: Class Opening Blank Line
    regex: '(?m)^[ \t]*(?:(?:public|internal|package|private|fileprivate|open|final)[ \t]+)*class[ \t]+[^\n{]+\{[ \t]*\n(?![ \t]*\n)'
    message: Add an empty line immediately after the opening brace of a class.
    severity: warning
  class_closing_blank_line:
    name: Class Closing Blank Line
    regex: '(?ms)^([ \t]*)(?:(?:public|internal|package|private|fileprivate|open|final)[ \t]+)*class[ \t]+[^\n{]+\{(?:(?!^\1\}).)*\n[ \t]*\S[^\n]*\n\1\}'
    message: Add an empty line immediately before the closing brace of a class.
    severity: warning

reporter: xcode
