name: Tests

on:
  pull_request:
    branches:
      - develop
      - master

  push:
    branches:
      - develop
      - master

jobs:
  tests:
    name: Run Tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run tests
        run: |
          xcodebuild test \
            -scheme MediaPicker \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO