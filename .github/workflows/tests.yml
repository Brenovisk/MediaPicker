name: Tests

on:
  pull_request:
    branches:
      - develop
      - master

  push:
    branches:
      - develop
      - master

jobs:
  tests:
    name: Run Tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install SwiftLint
        env:
          SWIFTLINT_ARCHIVE_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
        run: |
          swiftlint_version=$(tr -d '[:space:]' < .swiftlint-version)
          swiftlint_directory="$RUNNER_TEMP/swiftlint"
          swiftlint_archive="$RUNNER_TEMP/swiftlint.zip"

          curl --fail --location --silent --show-error \
            --output "$swiftlint_archive" \
            "https://github.com/realm/SwiftLint/releases/download/$swiftlint_version/portable_swiftlint.zip"

          echo "$SWIFTLINT_ARCHIVE_SHA256  $swiftlint_archive" | shasum -a 256 --check
          mkdir -p "$swiftlint_directory"
          unzip -q "$swiftlint_archive" -d "$swiftlint_directory"
          chmod +x "$swiftlint_directory/swiftlint"
          echo "$swiftlint_directory" >> "$GITHUB_PATH"

      - name: Run SwiftLint
        run: ./.scripts/lint.sh

      - name: Build Example App
        working-directory: Example
        run: |
          xcodebuild build \
            -project MediaPickerExample.xcodeproj \
            -scheme MediaPicker-Example \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run package tests
        run: swift test
